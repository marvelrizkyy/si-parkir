  <!-- Letter P (Parking Symbol Geometry) -->
  <path d="M 22 17 L 35 17 C 42.5 17 46 20.2 46 26.5 C 46 32.8 42.5 36 35 36 L 29.5 36 L 29.5 47 L 22 47 Z M 29.5 23.5 L 29.5 29.5 L 34.5 29.5 C 37.5 29.5 39 28.3 39 26.5 C 39 24.7 37.5 23.5 34.5 23.5 Z" fill="#ffffff"/>

